name: Build and Release

# Manual release: builds the Tauri installers on all three platforms and
# publishes them as a GitHub release. Run from Actions > Build and Release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Next version (e.g., 0.2.11); all app versions are set automatically'
        required: true
        type: string
      prerelease:
        description: 'Mark the GitHub release as a pre-release?'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  # Shared with code_formatter.yml (same group name): serialize the two
  # workflows per branch so the formatter's direct push can never race the
  # version-bump push mid-release. Queue (false), never cancel a release.
  group: applio-format-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout selected source commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set app versions from release input
        id: version
        run: node scripts/sync-version.mjs
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}

      - name: Verify release target and signing configuration
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ "$REF_TYPE" != "branch" ]; then
            echo "Run the release workflow from a branch."
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Configure the TAURI_SIGNING_PRIVATE_KEY repository secret first."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG"; then
            echo "Release tag already exists: $RELEASE_TAG"
            exit 1
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
          fi

      - name: Commit automatic version update
        id: commit
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add package.json frontend/web/package.json frontend/desktop/package.json assets/config_template.json Cargo.toml Cargo.lock frontend/desktop/src-tauri/tauri.conf.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bump version to $RELEASE_VERSION [skip ci]"
          fi
          # A concurrent branch change fails safely; never rebase built code.
          git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            id: win
            build-command: pnpm build:win
          - os: macos-latest
            id: mac-arm64
            build-command: pnpm build:mac
          - os: macos-15-intel
            id: mac-x64
            build-command: pnpm build:mac
          - os: ubuntu-24.04
            id: linux
            build-command: pnpm build:linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 1
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: frontend/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('frontend/web/**/*.ts', 'frontend/web/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check release regressions
        run: node --test scripts/check-realtime-audio.mjs scripts/check-settings-actions.mjs scripts/check-update-policy.mjs

      - name: Test lazy realtime initialization and model caches
        run: python scripts/check-realtime-service.py

      - name: Check TypeScript
        run: pnpm -r typecheck

      - name: Test native API lifecycle
        run: node scripts/cargo.mjs test -p applio-api --lib

      - name: Build app
        run: ${{ matrix.build-command }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          APPLIO_UPDATER_PUBLIC_KEY: ${{ secrets.APPLIO_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify AppImage media bundle
        if: runner.os == 'Linux'
        run: node scripts/check-appimage-media.mjs

      - name: Collect Tauri installers
        run: node scripts/collect-tauri-artifacts.mjs

      - name: Upload build artifacts
        # Installers are already compressed (.exe/.dmg/.AppImage/.deb), so
        # upload them directly instead of re-zipping (saves CPU on every job
        # plus the unzip step in the release job).
        uses: actions/upload-artifact@v5
        with:
          name: build-${{ matrix.id }}
          path: frontend/desktop/dist-installers/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Full history keeps every commit between release tags available.
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Generate release notes with commit and comparison links
        run: node scripts/release-notes.mjs
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/applio-release-notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: ./release-files
          merge-multiple: true

      - name: List release files
        run: ls -la release-files/

      - name: Generate signed updater manifest
        run: node scripts/collect-tauri-artifacts.mjs --manifest release-files
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/applio-release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.commit }}
          name: Applio v${{ needs.prepare.outputs.version }}
          files: release-files/*
          body_path: ${{ runner.temp }}/applio-release-notes.md
          draft: false
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ !inputs.prerelease && 'true' || 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
