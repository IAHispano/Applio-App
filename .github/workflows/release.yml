name: Build and Release

# Manual release: builds the Electron installers on all three platforms and
# publishes them as a GitHub release. Run from Actions > Build and Release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 3.7.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark the GitHub release as a pre-release?'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  # Shared with code_formatter.yml (same group name): serialize the two
  # workflows per branch so the formatter's direct push can never race the
  # version-bump push mid-release. Queue (false), never cancel a release.
  group: applio-format-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            id: win
            build-command: pnpm build:win
          - os: macos-latest
            id: mac
            build-command: pnpm build:mac
          - os: ubuntu-24.04
            id: linux
            build-command: pnpm build:linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~\AppData\Local\electron\Cache
          key: ${{ runner.os }}-electron-33.2.1
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y rpm libopenjp2-tools
          # fpm (Ruby) is required by electron-builder for the .deb target.
          command -v fpm >/dev/null || sudo gem install fpm --no-document || echo "fpm install failed, continuing"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: app/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/web/**/*.ts', 'app/web/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      - name: Sync version to release input
        run: node scripts/sync-version.mjs
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}

      - name: Build app
        run: ${{ matrix.build-command }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # Unsigned CI builds (no Apple Developer certificate on runners).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifacts
        # Installers are already compressed (.exe/.dmg/.AppImage/.deb), so
        # upload them directly instead of re-zipping (saves CPU on every job
        # plus the unzip step in the release job).
        uses: actions/upload-artifact@v5
        with:
          name: build-${{ matrix.id }}
          path: |
            app/desktop/dist-installers/Applio-*-Windows-Setup.exe
            app/desktop/dist-installers/Applio-*-macOS*.dmg
            app/desktop/dist-installers/Applio-*-macOS*.zip
            app/desktop/dist-installers/Applio-*-Linux*.AppImage
            app/desktop/dist-installers/Applio-*-Linux*.deb
            app/desktop/dist-installers/*.blockmap
            app/desktop/dist-installers/latest*.yml
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Shallow + tags is enough for the changelog (last tag + recent
          # commits) and much faster than the full history.
          fetch-depth: 100
          fetch-tags: true

      - name: Sync package versions to release input
        # Same sync as the build jobs, so the bump can be committed back.
        run: node scripts/sync-version.mjs
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}

      - name: Commit version bump back to branch
        # The build jobs only patch their own checkout, so without this the
        # repo would keep the old version and the sidebar badge would lag
        # one release behind. Direct commit (no PR) + [skip ci] so the
        # formatter workflow doesn't retrigger on the version bump.
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add package.json app/api/package.json app/web/package.json app/desktop/package.json assets/config_template.json
          if git diff --cached --quiet; then
            echo "Versions already in sync."
          else
            git commit -m "chore(release): bump version to ${{ github.event.inputs.version }} [skip ci]"
            # The checkout can lag behind main (e.g. the formatter bot
            # pushed meanwhile), so rebase onto the latest remote state
            # before pushing, retrying a few times. -Xtheirs keeps this
            # release's version lines on the rare same-line conflict.
            for i in 1 2 3; do
              git fetch origin ${{ github.ref_name }} || { sleep 5; continue; }
              if git rebase -Xtheirs "origin/${{ github.ref_name }}"; then
                break
              fi
              git rebase --abort || true
              sleep 5
            done
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Get commit messages since last tag
        id: changelog
        run: |
          REPO_URL="https://github.com/${{ github.repository }}"
          LAST_TAG=$(git describe --tags --abbrev=0 || echo "")
          echo "Last tag: $LAST_TAG"

          if [ -z "$LAST_TAG" ]; then
            LOG_RANGE="HEAD"
          else
            LOG_RANGE="$LAST_TAG..HEAD"
          fi

          COMMITS=$(git log $LOG_RANGE -n 50 --pretty=format:"- [\`%h\`]($REPO_URL/commit/%H) %s (%an)")
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: ./release-files
          merge-multiple: true

      - name: List release files
        run: ls -la release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Applio v${{ github.event.inputs.version }}
          files: release-files/*
          body: |
            ${{ steps.changelog.outputs.changelog }}

            ### macOS first launch
            The app is not Apple-notarized yet. If macOS reports Applio is "damaged", run `xattr -cr /Applications/Applio.app` and open it again.
          draft: false
          prerelease: ${{ github.event.inputs.prerelease }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
