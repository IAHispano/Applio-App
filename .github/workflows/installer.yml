name: "Installer"
on: workflow_dispatch
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4.0.0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install Node.js dependencies
        run: pnpm install --filter=installer
      
      - name: Build installer
        run: pnpm build:installer
      
      - name: Create Release Directory
        run: mkdir release
      
      - name: Copy Build Artifacts
        run: |
          Copy-Item "build\*" -Destination "release\" -Recurse
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release\*
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release\*
          tag_name: installer-${{ steps.package-version.outputs.VERSION }}
          name: Installer v${{ steps.package-version.outputs.VERSION }}
          body: Windows installer for version ${{ steps.package-version.outputs.VERSION }}
