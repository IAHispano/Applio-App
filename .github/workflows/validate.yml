name: Validate release readiness

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: dmg,app
          - os: macos-15-intel
            bundles: dmg,app
          - os: ubuntu-24.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-tools xvfb dbus-x11
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Check TypeScript
        run: pnpm -r typecheck
      - name: Test audio, workflows, updates and realtime service
        run: pnpm check
      - name: Check Rust formatting
        run: node scripts/cargo.mjs fmt --all -- --check
      - name: Test native API
        run: node scripts/cargo.mjs test -p applio-api --lib
      - name: Build unsigned installers and exported interface
        # Exercise release-mode packaging without publishing or signing secrets.
        working-directory: frontend/desktop
        run: pnpm exec tauri build --bundles ${{ matrix.bundles }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Verify AppImage media bundle
        if: runner.os == 'Linux'
        run: node scripts/collect-tauri-artifacts.mjs --check-appimage-media
      - name: Smoke-test packaged Linux desktop
        if: runner.os == 'Linux'
        shell: bash
        run: |
          image=$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)
          test -n "$image"
          dbus-run-session -- xvfb-run -a python scripts/checks/desktop-startup.py "$image" --appimage-extract-and-run
      - name: Smoke-test macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          image=$(find target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$image"
          mountpoint="$RUNNER_TEMP/applio-dmg"
          mkdir -p "$mountpoint"
          hdiutil attach "$image" -readonly -nobrowse -mountpoint "$mountpoint"
          detach_image() {
            result=$?
            # WebKit helpers can briefly retain the image after the app exits.
            for attempt in 1 2 3 4 5; do
              if hdiutil detach "$mountpoint"; then
                return "$result"
              fi
              sleep 1
            done
            return 1
          }
          trap detach_image EXIT
          executable=$(find "$mountpoint/Applio.app/Contents/MacOS" -type f -perm +111 -print -quit)
          test -n "$executable"
          python scripts/checks/desktop-startup.py "$executable"
      - name: Upload installers for platform acceptance tests
        uses: actions/upload-artifact@v5
        with:
          name: validation-${{ matrix.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
