name: Code Formatter

on:
  push:
    branches:
      - main
    paths:
      - '**/*.py'
      - '**/*.ipynb'
      - 'app/**'
      - 'tests/**'
      - 'biome.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/code_formatter.yml'

jobs:
  format:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Python formatters
        run: pip install "black[jupyter]" autoflake

      # Python formatting runs BEFORE pnpm install so node_modules
      # doesn't even exist yet when black/autoflake scan the tree.
      - name: Run autoflake (Python)
        run: autoflake --in-place --recursive --exclude=node_modules,.venv,venv,dist,build,.git,__pycache__,.next .

      - name: Run Black (Python)
        # NOTE: use --extend-exclude, NOT --exclude. --exclude would
        # override black's defaults (which skip node_modules, .venv,
        # dist, build, ...) and cause third-party code to be reformatted.
        run: black . --extend-exclude=".*\.ipynb$"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # NOTE: format only (no lint). `pnpm format` runs `biome check`,
      # which fails on pre-existing lint debt. The formatter job must
      # apply what it can and exit 0, not go red on lint findings.
      - name: Run Biome formatter (app)
        run: pnpm exec biome format --write app tests

      - name: Organize imports (app)
        run: pnpm exec biome check --write --formatter-enabled=false --linter-enabled=false app tests

      - name: Commit back
        continue-on-error: true
        id: commitback
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add --all
          git commit -m "chore(format): run formatters on ${{ github.ref_name }}"

      - name: Create Pull Request
        if: steps.commitback.outcome == 'success'
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          delete-branch: true
          body: "Automatically apply code formatter changes (Black + Biome)."
          title: "chore(format): run formatters on ${{ github.ref_name }}"
          commit-message: "chore(format): run formatters on ${{ github.ref_name }}"
          branch: formatter/${{ github.ref_name }}
