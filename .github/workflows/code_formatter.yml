name: Code Formatter

on:
  push:
    branches:
      - main
    paths:
      - '**/*.py'
      - '**/*.ipynb'
      - 'app/**'
      - 'tests/**'
      - 'biome.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/code_formatter.yml'

jobs:
  format:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Python formatters
        run: pip install "black[jupyter]" autoflake

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Run autoflake (Python)
        run: autoflake --in-place --recursive .

      - name: Run Black (Python)
        run: black . --exclude=".*\.ipynb$"

      - name: Run Biome (app)
        run: pnpm format

      - name: Commit back
        continue-on-error: true
        id: commitback
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add --all
          git commit -m "chore(format): run formatters on ${{ github.ref_name }}"

      - name: Create Pull Request
        if: steps.commitback.outcome == 'success'
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          delete-branch: true
          body: "Automatically apply code formatter changes (Black + Biome)."
          title: "chore(format): run formatters on ${{ github.ref_name }}"
          commit-message: "chore(format): run formatters on ${{ github.ref_name }}"
          branch: formatter/${{ github.ref_name }}
