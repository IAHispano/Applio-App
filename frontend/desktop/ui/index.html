<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Applio</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #09090b; color: #f5f5f5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    main { width: min(100%, 40rem); min-width: 0; padding: clamp(18px, 4vw, 32px); background: #151517; border: 1px solid #303034; border-radius: 12px; }
    [hidden] { display: none !important; }
    h1 { margin: 0; font-size: clamp(26px, 4vw, 32px); line-height: 1.2; letter-spacing: -.02em; }
    p { margin: 8px 0 20px; color: #b5b5bb; line-height: 1.6; }
    pre { margin: 0 0 20px; padding: 12px 14px; background: #0d0d10; border: 1px solid #303034; border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 45vh; overflow: auto; color: #e3e3e8; font: .875rem/1.6 ui-monospace, monospace; }
    button { background: #f5f5f5; color: #111; border: 0; border-radius: 10px; min-height: 44px; padding: 6px 14px; font: 600 .875rem/1.35 system-ui, sans-serif; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    button:focus-visible { outline: 2px solid #eee; outline-offset: 4px; }
  </style>
</head>
<body>
  <main id="startup-error" hidden>
    <h1>Applio could not start</h1>
    <p>Check the details below, then try again.</p>
    <pre id="error" role="alert"></pre>
    <button id="retry" type="button">Retry startup</button>
  </main>
  <script>
    (() => {
      const native = window.__TAURI__;
      if (!native) return;
      const panel = document.getElementById('startup-error');
      const retry = document.getElementById('retry');
      let revision = 0;
      const showError = error => {
        if (!error) return;
        revision++;
        document.getElementById('error').textContent = String(error);
        document.body.dataset.failed = 'true';
        panel.hidden = false;
        retry.disabled = false;
        retry.textContent = 'Retry startup';
      };
      native.event.listen('startup-error', event => showError(event.payload)).catch(() => {});
      const initial = revision;
      native.core.invoke('startup_error').then(error => {
        if (initial === revision) showError(error);
      }).catch(showError);
      retry.onclick = async () => {
        revision++;
        retry.disabled = true;
        retry.textContent = 'Retrying…';
        try { await native.core.invoke('retry_startup'); }
        catch (error) { showError(error); }
      };
    })();
  </script>
</body>
</html>
