appId: org.applio.app
productName: Applio
copyright: Copyright © AI Hispano
compression: normal
asar: false
afterPack: ./afterPack.js

directories:
  output: dist-installers

publish:
  - provider: github
    owner: IAHispano
    repo: Applio-app

files:
  - dist/**/*
  - package.json
  - "!**/.venv/**"
  - "!**/venv/**"
  - from: ../..
    to: .
    filter:
      - requirements.txt
      - LICENSE
      - ffmpeg.exe
      - ffprobe.exe
      - ffmpeg
      - ffprobe
  - from: ../../rvc
    to: rvc
    filter:
      - "**/*"
      - "!**/__pycache__"
      - "!**/*.pyc"
      - "!**/.venv/**"
      - "!**/venv/**"
  - from: ../../uvr
    to: uvr
    filter:
      - "**/*"
      - "!**/__pycache__"
      - "!**/*.pyc"
  - from: ../../tools
    to: tools
    filter:
      - "**/*"
      - "!**/__pycache__"
      - "!**/*.pyc"
  - from: ../../assets
    to: assets
    filter:
      - "**/*"
      - "!**/__pycache__"
      - "!**/*.pyc"
      - "!**/.venv/**"
      - "!**/venv/**"
  - from: ../../plugins
    to: plugins
    filter:
      - "**/*"
      - "!**/.venv/**"
      - "!**/venv/**"
  - from: ../../app/api/dist
    to: app/api/dist
  - from: ../../app/api/package.json
    to: app/api/package.json
  # NOTE: standalone is copied as one whole tree. copy-static.mts
  # (web postbuild) already places .next/static, public, and real
  # node_modules dirs inside it, so do NOT list them again here:
  # duplicate file sets race on the same destination and fail on
  # macOS/Linux with EEXIST hard-link errors in electron-builder.
  - from: ../../app/web/.next/standalone
    to: app/web/.next/standalone

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: ../../assets/ICON.ico
  signAndEditExecutable: false
  artifactName: Applio-${version}-Windows-Setup.${ext}

nsis:
  artifactName: Applio-${version}-Windows-Setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Applio
  uninstallDisplayName: Applio
  installerIcon: ../../assets/ICON.ico
  uninstallerIcon: ../../assets/ICON.ico
  installerHeaderIcon: ../../assets/ICON.ico
  runAfterFinish: true
  deleteAppDataOnUninstall: false

mac:
  category: public.app-category.music
  icon: ../../assets/icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: Applio-${version}-macOS-${arch}.${ext}

dmg:
  icon: ../../assets/icon.icns
  artifactName: Applio-${version}-macOS-${arch}.${ext}

linux:
  category: AudioVideo
  icon: ../../assets/icon.png
  maintainer: AI Hispano
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  artifactName: Applio-${version}-Linux-${arch}.${ext}

appImage:
  artifactName: Applio-${version}-Linux.${ext}

deb:
  artifactName: Applio-${version}-Linux.${ext}
